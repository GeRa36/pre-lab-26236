        <section class="contacto">
            <h2>Contactanos</h2>

            <p>¿Tenés alguna consulta o sugerencia?
                Completá el formulario y escribinos.</p>

        <!-- Formulario de contacto -->

        <form action="https://formspree.io/f/mnpjblqr"
            method="post">

        <div>
            <label for="nombre">Nombre:</label>

            <input type="text"
            id="nombre"
            name="nombre"
            required>
        </div>

        <div>
            <label for="email">Correo electrónico</label>

            <input type="email"
            id="email"
            name="email"
            required>
        </div>

        <div>
            <label for="mensaje">Mensaje</label>

            <textarea name="mensaje"
            id="mensaje"
            rows="5"
            required></textarea>
        </div>

        <button type="submit">
            Enviar mensaje
        </button>

</form>
